[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-ingestion-framework"
version = "0.1.0"
description = "Config-driven ETL ingestion with data-quality reporting, Redis-backed run state and JWT-protected API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Omosa" }]
requires-python = ">=3.10"

[project.optional-dependencies]
redis = ["redis==8.1.0"]

[project.scripts]
etl-ingest = "etl_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
